<section class="card table-card operations-servers"><div class="table-caption"><h2>操作记录</h2><span class="muted small">已提交不等于已生效</span></div><div class="table-scroll"><table><thead><tr><th>操作</th><th>状态</th><th>提交时间</th><th>结果与影响</th></tr></thead><tbody>{% for job in jobs %}<tr><td>{{ job.action }}</td><td><span class="badge neutral">{{ job.state_label }}</span></td><td>{{ job.created_at|date:'m-d H:i' }}</td><td>{{ job.result_message|default:'等待执行回执' }}{% if job.impact_message %}<small class="table-subtext">{{ job.impact_message }}</small>{% endif %}</td></tr>{% empty %}<tr><td colspan="4"><p class="muted">还没有操作记录。</p></td></tr>{% endfor %}</tbody></table></div></section>
