{% if page_obj and page_obj.paginator.num_pages > 1 %}<nav class="pagination" aria-label="分页"><span>第 {{ page_obj.number }} / {{ page_obj.paginator.num_pages }} 页 · 共 {{ page_obj.paginator.count }} 项</span><div class="button-row">{% if previous_url %}<a class="button secondary small-button" href="{{ previous_url }}">上一页</a>{% endif %}{% if next_url %}<a class="button secondary small-button" href="{{ next_url }}">下一页</a>{% endif %}</div></nav>{% endif %}
